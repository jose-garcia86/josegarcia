# Base site configuration
base_url = "https://josegarcia.dev"
title = "Jose Garcia"
description = "Software Developer — Rust, System Architecture, and Technical Writing."
default_language = "en"
output_dir = "public"
compile_sass = false
minify_html = false
author = "Jose Garcia"

# Ignore draft folders inside content/
ignored_content = ["_drafts/**", "**/_drafts/**"]
ignored_static = []

# Feed and SEO configuration
generate_feeds = true
feed_filenames = ["atom.xml"]
feed_limit = 50
build_search_index = false
generate_sitemap = true
generate_robots_txt = true

# Markdown rendering configuration
[markdown]
render_emoji = false
external_links_class = ""
external_links_target_blank = false
external_links_no_follow = false
external_links_no_referrer = false
smart_punctuation = false
definition_list = false
lazy_async_image = false
bottom_footnotes = false
insert_anchor_links = "none"

# Syntax highlighting configuration (Zola 0.20+ schema)
[markdown.highlighting]
error_on_missing_language = false
extra_grammars = []
extra_themes = []
theme = "github-dark"

[link_checker]
skip_prefixes = [
    "http://[2001:db8::]/",
]
skip_anchor_prefixes = [
    "https://caniuse.com/",
]
internal_level = "error"
external_level = "error"

[slugify]
paths = "on"
taxonomies = "on"
anchors = "on"
paths_keep_dates = false

[languages.en]
taxonomies = [
    { name = "categories", feed = true, paginate_by = 20 },
    { name = "tags", feed = true, paginate_by = 20 },
]

[languages.en.translations]
language_name = "English"

[extra]
author = "Jose Garcia"
role = "Software Developer"
stack = "Rust · Systems · Web · Technical Writing"
location = "Europe"
status = "Building reliable software & writing technical notes"

